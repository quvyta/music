[music.cli]
help = """
qmus {version}: ターミナル用ミュージックプレーヤー

使用法: qmus [FOLDER]

  FOLDER       このフォルダの音楽を表示します。
               フォルダを指定しない場合、qmus は Music フォルダを表示します。
  --version    バージョンを表示します
  --help       このヘルプを表示します

起動時に1日1回、crates.io に新しいバージョンがあるか確認します。設定で無効にできます。"""
