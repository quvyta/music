album = "アルバム"
time = "時間"
tracks = "曲数"
albums = "アルバム数"

[music.player]
play = "再生"
pause = "一時停止"
next = "次の曲"
previous = "前の曲"
idle = "再生する曲を選んでください"
mute = "ミュート"
unmute = "ミュート解除"
shuffle = "シャッフル"
repeat-off = "リピート: オフ"
repeat-all = "リピート: キュー全体"
