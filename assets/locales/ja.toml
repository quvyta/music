[music.play]
failed = "{name} を再生できませんでした"

[music.later]
title = "Opus ファイルはまだ再生できません"
text = "qmus はこれらを隠さずに表示します。再生は今後のバージョンで対応予定です。"

[music.output]
lost = "音声出力が停止しました"

[music.settings]
title = "設定"
not-saved = "設定を保存できませんでした"
playing = "再生"
resume = "前回の続きから再開"
resume-text = "起動時に、前回終了時のキューが同じ曲の同じ秒の位置で復元されます。"
