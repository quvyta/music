[music.settings]
title = "Settings"
not-saved = "The settings could not be saved"
playing = "Playing"
resume = "Pick up where you left off"
resume-text = "At start, the queue of the last run comes back, held at the same track and second."
visualizer = "Visualizer"
style = "Style"
style-bars = "Bars"
style-mirror = "Mirror"
style-off = "Off"
live = "Keep it moving"
live-text = "Moves with the sound even when motion is reduced."

[music.cli]
help = """
qmus {version}: a music player for the terminal

Usage: qmus [FOLDER]

  FOLDER       the music of this folder is shown.
               Without a folder qmus shows your Music folder.
  --version    print the version
  --help       print this help

Once a day at start qmus asks crates.io whether a newer version is out; turn it off in the settings."""
missing = "qmus: {path} is not a folder"
unknown = "qmus: unknown option {argument}; see qmus --help"

