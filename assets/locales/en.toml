[music.cli]
help = """
qmus {version}: a music player for the terminal

Usage: qmus [FOLDER]

  FOLDER       the music of this folder is shown.
               Without a folder qmus shows your Music folder.
  --version    print the version
  --help       print this help

Once a day at start qmus asks crates.io whether a newer version is out; turn it off in the settings."""
missing = "qmus: {path} is not a folder"
