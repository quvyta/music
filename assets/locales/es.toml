# Español

[meta]
name = "Español"
code = "es"
fallback = "en"

[music]
too-small = "La terminal es demasiado pequeña"
count = { one = "{n} pista", other = "{n} pistas" }
back = "Atrás"

[music.empty]
title = "No hay música aquí"
text = "No hay archivos de música en {folder}. Dale a qmus una carpeta con música: qmus ~/Music/albums"

[music.column]
playlist = "Lista"
number = "N.º"
title = "Título"
artist = "Artista"
album = "Álbum"
time = "Tiempo"
tracks = "Pistas"
albums = "Álbumes"

[music.player]
play = "Reproducir"
pause = "Pausar"
