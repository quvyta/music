previous = "Pista anterior"
idle = "Elige una pista para reproducir"
mute = "Silenciar"
unmute = "Activar sonido"
shuffle = "Aleatorio"
repeat-off = "Repetir: no"
repeat-all = "Repetir: toda la cola"
repeat-one = "Repetir: esta pista"

[music.play]
failed = "No se pudo reproducir {name}"

[music.later]
title = "Los archivos Opus aún no se pueden reproducir"
text = "qmus los muestra en lugar de ocultarlos; la reproducción llegará en una versión posterior."

[music.output]
lost = "La salida de sonido se detuvo"

[music.settings]
title = "Ajustes"
not-saved = "No se pudieron guardar los ajustes"
playing = "Reproducción"
resume = "Retomar donde lo dejaste"
resume-text = "Al arrancar, vuelve la cola de la última sesión, en la misma pista y segundo."
visualizer = "Visualizador"
style = "Estilo"
style-bars = "Barras"
style-mirror = "Espejo"
style-off = "Apagado"
live = "Mantener el movimiento"
live-text = "Se mueve con el sonido incluso cuando el movimiento está reducido."

[music.cli]
help = """
qmus {version}: un reproductor de música para la terminal

Uso: qmus [CARPETA]

  CARPETA      muestra la música de esta carpeta.
               Sin carpeta, qmus muestra tu carpeta Música.
  --version    muestra la versión
  --help       muestra esta ayuda

Una vez al día, al arrancar, qmus le pregunta a crates.io si hay una versión más nueva; puedes desactivarlo en los ajustes."""
missing = "qmus: {path} no es una carpeta"
unknown = "qmus: opción desconocida {argument}; consulta qmus --help"

