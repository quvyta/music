[music.cli]
help = """
qmus {version} : un lecteur de musique pour le terminal

Usage : qmus [DOSSIER]

  DOSSIER      la musique de ce dossier est affichée.
               Sans dossier, qmus affiche votre dossier Musique.
  --version    affiche la version
  --help       affiche cette aide

Une fois par jour au démarrage, qmus demande à crates.io si une nouvelle version est sortie ; désactivez cette option dans les paramètres."""
