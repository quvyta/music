[music.cli]
help = """
qmus {version}：终端音乐播放器

用法: qmus [FOLDER]

  FOLDER       显示该文件夹中的音乐。
               不指定文件夹时，qmus 显示你的 Music 文件夹。
  --version    打印版本
  --help       打印此帮助

每天启动时 qmus 会向 crates.io 查询是否有新版本；可在设置中关闭。"""
