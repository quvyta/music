[music.cli]
help = """
qmus {version}: ein Musikplayer fürs Terminal

Aufruf: qmus [FOLDER]

  FOLDER       die Musik dieses Ordners wird angezeigt.
               Ohne Ordner zeigt qmus deinen Musik-Ordner.
  --version    gibt die Version aus
  --help       zeigt diese Hilfe

Einmal am Tag fragt qmus beim Start crates.io, ob es eine neuere Version gibt; in den Einstellungen kannst du das abschalten."""
missing = "qmus: {path} ist kein Ordner"
unknown = "qmus: unbekannte Option {argument}; siehe qmus --help"

