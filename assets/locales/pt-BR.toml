# Português (Brasil)

[meta]
name = "Português (Brasil)"
code = "pt-BR"
fallback = "en"

[music]
too-small = "O terminal é muito pequeno"
count = { one = "{n} faixa", other = "{n} faixas" }
back = "Voltar"

[music.empty]
title = "Nenhuma música aqui"
text = "Não há arquivos de música em {folder}. Dê ao qmus uma pasta com músicas: qmus ~/Music/albums"

[music.column]
playlist = "Playlist"
number = "Nº"
title = "Título"
artist = "Artista"
album = "Álbum"
time = "Duração"
tracks = "Faixas"
albums = "Álbuns"

[music.player]
play = "Reproduzir"
pause = "Pausar"
next = "Próxima faixa"
previous = "Faixa anterior"
idle = "Escolha uma faixa para reproduzir"
mute = "Silenciar"
unmute = "Ativar som"
shuffle = "Aleatório"
repeat-off = "Repetir: desativado"
repeat-all = "Repetir: a fila inteira"
repeat-one = "Repetir: esta faixa"

[music.play]
failed = "{name} não pôde ser reproduzido"

[music.later]
title = "Arquivos Opus ainda não podem ser tocados"
text = "O qmus os mostra em vez de escondê-los; a reprodução chega em uma versão futura."

[music.output]
lost = "A saída de som parou"

[music.settings]
title = "Configurações"
not-saved = "Não foi possível salvar as configurações"
playing = "Reprodução"
resume = "Retomar de onde parou"
resume-text = "Na inicialização, a fila da última execução volta, mantida na mesma faixa e segundo."
visualizer = "Visualizador"
style = "Estilo"
style-bars = "Barras"
style-mirror = "Espelho"
style-off = "Desativado"
live = "Manter em movimento"
live-text = "Move-se com o som mesmo quando o movimento é reduzido."

[music.cli]
help = """
qmus {version}: um reprodutor de música para o terminal

Uso: qmus [PASTA]

  PASTA        a música desta pasta é exibida.
               Sem uma pasta, o qmus mostra sua pasta Music.
  --version    mostra a versão
  --help       mostra esta ajuda

Uma vez por dia, na inicialização, o qmus pergunta ao crates.io se há uma versão mais nova; desative isso nas configurações."""
missing = "qmus: {path} não é uma pasta"
unknown = "qmus: opção desconhecida {argument}; veja qmus --help"

