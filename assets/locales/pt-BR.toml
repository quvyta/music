tracks = "faixas"
queue = "fila"
albums = "álbuns"
artists = "artistas"
search = "pesquisar"
sidebar = "barra lateral"
remove = "tirar da fila, ou remover uma playlist"
playlists = "playlists"
save-queue = "guardar a fila como uma playlist"

