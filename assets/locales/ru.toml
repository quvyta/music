# Русский

[meta]
name = "Русский"
code = "ru"
fallback = "en"

[music]
too-small = "Терминал слишком мал"
count = { one = "{n} трек", few = "{n} трека", many = "{n} треков", other = "{n} трека" }
back = "Назад"

[music.empty]
title = "Здесь нет музыки"
text = "В {folder} нет музыкальных файлов. Укажите qmus папку с музыкой: qmus ~/Music/albums"

[music.column]
playlist = "Плейлист"
number = "№"
title = "Название"
artist = "Исполнитель"
album = "Альбом"
time = "Время"
tracks = "Треки"
albums = "Альбомы"

[music.player]
play = "Воспроизвести"
pause = "Пауза"
next = "Следующий трек"
previous = "Предыдущий трек"
idle = "Выберите трек для воспроизведения"
mute = "Выключить звук"
unmute = "Включить звук"
shuffle = "Перемешать"
repeat-off = "Повтор: выключен"
repeat-all = "Повтор: вся очередь"
repeat-one = "Повтор: этот трек"

[music.play]
failed = "Не удалось воспроизвести {name}"

[music.later]
title = "Файлы Opus пока нельзя воспроизвести"
text = "qmus показывает их, а не скрывает; воспроизведение появится в одной из следующих версий."

[music.output]
lost = "Звуковой вывод остановился"

[music.settings]
title = "Настройки"
not-saved = "Не удалось сохранить настройки"
playing = "Воспроизведение"
resume = "Продолжить с места остановки"
resume-text = "При запуске очередь из прошлого сеанса вернётся на том же треке и секунде."
visualizer = "Визуализатор"
style = "Стиль"
style-bars = "Полосы"
style-mirror = "Зеркало"
style-off = "Выключен"
live = "Пусть движется"
live-text = "Движется вместе со звуком, даже если анимации уменьшены."

[music.cli]
help = """
qmus {version}: музыкальный плеер для терминала

Использование: qmus [FOLDER]

  FOLDER       музыка из этой папки будет показана.
               Без папки qmus покажет вашу папку Music.
  --version    вывести версию
  --help       вывести эту справку

Раз в день при запуске qmus спрашивает crates.io, не вышла ли новая версия; отключить это можно в настройках."""
missing = "qmus: {path} — не папка"
unknown = "qmus: неизвестная опция {argument}; см. qmus --help"

[keys]
play-pause = "воспроизведение или пауза"
next = "следующий трек"
previous = "предыдущий трек"
settings = "настройки"
cancel = "закрыть"
seek-forward = "на 5 секунд вперёд"
seek-back = "на 5 секунд назад"
volume-up = "громче"
volume-down = "тише"
shuffle = "перемешать"
repeat = "повтор: выключен, вся очередь, этот трек"
now-playing = "сейчас играет"
tracks = "треки"
queue = "очередь"
albums = "альбомы"
artists = "исполнители"
search = "поиск"
sidebar = "боковая панель"
remove = "убрать из очереди или удалить плейлист"
playlists = "плейлисты"
save-queue = "сохранить очередь как плейлист"

[music.page]
playlists = "Плейлисты"
now-playing = "Сейчас играет"
nothing = "Ничего не играет"
queue = "Очередь"
tracks = "Треки"
albums = "Альбомы"
artists = "Исполнители"

[music.search]
