[package]
name = "quvyta-music"
description = "A music player for the terminal: your own library, gapless playback, album art and a visualizer drawn from the sound itself"
repository = "https://github.com/quvyta/music"
homepage = "https://quvyta.com/qmus/"
readme = "README.md"
keywords = ["tui", "terminal", "music", "player", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it.
include = ["/src/**", "/assets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[lib]
name = "qmus"
path = "src/lib.rs"

[dependencies]
quvyta-framework = { version = "0.1.33", features = ["updates", "image"] }
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }
cpal = "0.18"
rtrb = "0.3"
lofty = "0.25"
realfft = "3"
rubato = "5"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
md-5 = "0.10"
sha2 = "0.10"
getrandom = "0.4"
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
# librespot-core's build script needs vergen 9.0: vergen 9.1 brought a second vergen-lib whose
# traits the script cannot use. Naming the version here holds every build to it.
vergen = { version = "=9.0.6", default-features = false, optional = true }
percent-encoding = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io", "p2p"] }

[features]
default = []
# Spotify Premium through librespot, not built by default until it has been tried on a real account;
# without it qmus plays files and the person's own servers.
spotify = ["dep:librespot-core", "dep:librespot-audio", "dep:librespot-metadata", "dep:tokio", "dep:vergen"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
